name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  package:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            pack: linux
          - os: windows-latest
            pack: win
          - os: macos-latest
            pack: mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack:${{ matrix.pack }}
      - uses: actions/upload-artifact@v4
        with:
          name: freeai-${{ matrix.os }}
          path: release/*
      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: true
